  <h2 id="tạo-một-brand-empty">Tạo một brand empty</h2>
<div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>git checkout --orphan empty

git add README.md
git commit -m "Init empty branch"
